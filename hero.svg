<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
    <stop stop-color="#050505"/><stop offset="0.48" stop-color="#0C0D10"/><stop offset="1" stop-color="#16070A"/>
  </linearGradient>
  <radialGradient id="orb1"><stop stop-color="#FF304F" stop-opacity=".75"/><stop offset="1" stop-color="#FF304F" stop-opacity="0"/></radialGradient>
  <radialGradient id="orb2"><stop stop-color="#7C3AED" stop-opacity=".45"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0"><stop stop-color="#FF304F" stop-opacity="0"/><stop offset=".5" stop-color="#FF304F"/><stop offset="1" stop-color="#FF304F" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" stroke="#fff" stroke-opacity=".045"/></pattern>
  <style>
    .pulse{animation:pulse 4s ease-in-out infinite}.drift{animation:drift 9s ease-in-out infinite}.scan{animation:scan 5s linear infinite}.blink{animation:blink 1.8s steps(2,end) infinite}
    @keyframes pulse{0%,100%{opacity:.32;transform:scale(.92)}50%{opacity:.72;transform:scale(1.08)}}
    @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-18px)}}
    @keyframes scan{0%{transform:translateX(-500px)}100%{transform:translateX(1700px)}}
    @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.2}}
  </style>
</defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="518" rx="27" stroke="#FFFFFF" stroke-opacity=".14"/>
<rect width="1200" height="520" fill="url(#grid)"/>
<circle class="pulse" cx="1040" cy="70" r="230" fill="url(#orb1)" filter="url(#blur)"/>
<circle class="drift" cx="180" cy="450" r="210" fill="url(#orb2)" filter="url(#blur)"/>
<g opacity=".65" filter="url(#glow)">
  <circle cx="1030" cy="108" r="3" fill="#FF304F"/><circle cx="1090" cy="170" r="2" fill="#FF304F"/><circle cx="950" cy="190" r="2" fill="#A78BFA"/>
  <circle cx="160" cy="410" r="2" fill="#FF304F"/><circle cx="220" cy="360" r="3" fill="#A78BFA"/>
</g>
<path d="M0 390H1200" stroke="#fff" stroke-opacity=".08"/>
<path class="scan" d="M-400 388H200" stroke="url(#line)" stroke-width="3"/>
<text x="70" y="74" fill="#FF304F" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="4">GITHUB / DIGITAL IDENTITY / 2026</text>
<text x="70" y="205" fill="#F7F7F7" font-family="Arial,Helvetica,sans-serif" font-size="112" font-weight="900" letter-spacing="-7">KARTHICK</text>
<text x="74" y="251" fill="#A1A1AA" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing="6">CHEMIST  ×  DEVELOPER  ×  AI EXPLORER</text>
<text x="74" y="315" fill="#E4E4E7" font-family="Arial,Helvetica,sans-serif" font-size="18">Building at the intersection of science, software,</text>
<text x="74" y="344" fill="#E4E4E7" font-family="Arial,Helvetica,sans-serif" font-size="18">artificial intelligence and visual experiences.</text>
<g transform="translate(74 420)">
 <rect width="210" height="44" rx="22" fill="#FF304F" fill-opacity=".12" stroke="#FF304F" stroke-opacity=".7"/>
 <circle class="blink" cx="24" cy="22" r="5" fill="#FF304F"/>
 <text x="42" y="28" fill="#FCA5B3" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2">AVAILABLE TO BUILD</text>
</g>
<text x="1090" y="475" text-anchor="end" fill="#71717A" font-family="monospace" font-size="11" letter-spacing="2">SCROLL // EXPLORE // CREATE</text>
</svg>
