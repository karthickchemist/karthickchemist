<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAD22A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FAD22A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FAD22A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FAD22A" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="260" fill="#0a0a0a"/>
  <rect width="900" height="260" fill="url(#grid)"/>
  <rect width="900" height="260" fill="url(#scan)">
    <animate attributeName="y" from="-260" to="260" dur="4s" repeatCount="indefinite"/>
  </rect>

  <rect x="1" y="1" width="898" height="258" fill="none" stroke="#FAD22A" stroke-width="2" stroke-opacity="0.5"/>

  <text x="50" y="70" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="14" fill="#FAD22A" opacity="0.7">&gt; whoami</text>

  <text x="50" y="140" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="56" font-weight="700" fill="#FAD22A" letter-spacing="2">
    KARTHICK
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <text x="50" y="175" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="18" fill="#ffffff" letter-spacing="1">
    AI-Integrated Web Developer // Ex-Chemist
  </text>

  <text x="50" y="210" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" fill="#FAD22A" opacity="0.6">
    [ B.Sc Chemistry ] --&gt; [ React ] --&gt; [ GSAP ] --&gt; [ AI Workflows ]
  </text>

  <rect x="52" y="222" width="10" height="16" fill="#FAD22A">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
