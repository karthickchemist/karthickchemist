<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFE600" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFE600" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#FFE600" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE600" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFE600" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFE600" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="280" fill="#000000"/>
  <rect width="900" height="280" fill="url(#grid)"/>
  <rect width="900" height="280" fill="url(#glow)"/>

  <rect x="1" y="1" width="898" height="278" fill="none" stroke="#FFE600" stroke-width="1.5" stroke-opacity="0.55"/>
  <path d="M0 30 H40 M0 250 H40 M860 30 H900 M860 250 H900" stroke="#FFE600" stroke-width="1.5" opacity="0.6"/>
  <circle cx="40" cy="30" r="3" fill="#FFE600"/>
  <circle cx="860" cy="250" r="3" fill="#FFE600"/>

  <text x="46" y="55" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#FFE600" opacity="0.75" letter-spacing="2">SYSTEM // PROFILE.INIT</text>

  <text x="46" y="140" font-family="'Orbitron','JetBrains Mono',sans-serif" font-size="62" font-weight="900" fill="#FFE600" letter-spacing="3">
    KARTHICK
  </text>

  <rect x="48" y="155" width="0" height="4" fill="url(#line)">
    <animate attributeName="width" from="0" to="500" dur="1.6s" fill="freeze"/>
  </rect>

  <text x="46" y="190" font-family="'JetBrains Mono','Courier New',monospace" font-size="19" fill="#ffffff" letter-spacing="1" opacity="0.9">
    AI-Integrated Web Developer <tspan fill="#FFE600">//</tspan> Ex-Chemist
  </text>

  <text x="46" y="222" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#FFE600" opacity="0.65" letter-spacing="0.5">
    [ B.Sc Chemistry ] → [ React / GSAP ] → [ Applied AI Systems ]
  </text>

  <text x="46" y="252" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#ffffff" opacity="0.5">
    Dindigul, Tamil Nadu, India
  </text>

  <rect x="46" y="258" width="10" height="14" fill="#FFE600">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
