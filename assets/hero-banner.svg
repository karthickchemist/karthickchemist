<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="900" height="300" fill="#0d0d0d"/>
  <rect width="900" height="300" fill="url(#dots)"/>
  <rect width="900" height="300" fill="url(#fade)"/>

  <rect x="1" y="1" width="898" height="298" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>

  <!-- terminal top bar -->
  <rect x="1" y="1" width="898" height="30" fill="#1a1a1a"/>
  <circle cx="22" cy="16" r="5" fill="#4a4a4a"/>
  <circle cx="40" cy="16" r="5" fill="#4a4a4a"/>
  <circle cx="58" cy="16" r="5" fill="#4a4a4a"/>
  <text x="450" y="21" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" fill="#8a8a8a" text-anchor="middle" letter-spacing="1">karthick@dev ~ profile.sh</text>

  <text x="45" y="75" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#8a8a8a" letter-spacing="1">$ whoami</text>

  <text x="45" y="150" font-family="'Orbitron','JetBrains Mono',sans-serif" font-size="60" font-weight="900" fill="#ffffff" letter-spacing="3">
    KARTHICK
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
  </text>

  <rect x="48" y="165" width="0" height="3" fill="#ffffff">
    <animate attributeName="width" from="0" to="480" dur="1.4s" fill="freeze"/>
  </rect>

  <text x="45" y="200" font-family="'JetBrains Mono','Courier New',monospace" font-size="18" fill="#d4d4d4" letter-spacing="0.5">
    AI-Integrated Web Developer <tspan fill="#ffffff">//</tspan> Ex-Chemist
  </text>

  <text x="45" y="230" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#8a8a8a">
    [ B.Sc Chemistry ] → [ React / GSAP ] → [ Applied AI Systems ]
  </text>

  <text x="45" y="260" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#6b6b6b">
    Dindigul, Tamil Nadu, India
  </text>

  <rect x="45" y="270" width="9" height="14" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- scanning line -->
  <rect x="1" y="31" width="898" height="2" fill="#ffffff" opacity="0.15">
    <animate attributeName="y" values="31;268;31" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
