<svg width="340" height="320" viewBox="0 0 340 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="340" height="320" fill="#0d0d0d"/>

  <!-- desk -->
  <rect x="20" y="230" width="300" height="10" fill="#3a3a3a"/>
  <rect x="35" y="240" width="10" height="50" fill="#2a2a2a"/>
  <rect x="295" y="240" width="10" height="50" fill="#2a2a2a"/>

  <!-- monitor -->
  <rect x="90" y="110" width="160" height="110" rx="4" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="2"/>
  <rect x="100" y="120" width="140" height="90" fill="#000000"/>
  <rect x="160" y="220" width="20" height="14" fill="#2a2a2a"/>
  <rect x="140" y="234" width="60" height="6" fill="#2a2a2a"/>

  <!-- code lines typing animation -->
  <g font-family="'JetBrains Mono',monospace" font-size="9" fill="#ffffff">
    <text x="108" y="135">
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="0s"/>
      const dev = "karthick";
    </text>
    <text x="108" y="150">
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="0.6s"/>
      function build() {
    </text>
    <text x="118" y="165">
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="1.2s"/>
      return "AI + Web";
    </text>
    <text x="108" y="180">
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="1.8s"/>
      }
    </text>
    <text x="108" y="195">
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="2.4s"/>
      build(); <tspan fill="#8a8a8a">_</tspan>
    </text>
  </g>

  <!-- screen glow flicker -->
  <rect x="100" y="120" width="140" height="90" fill="#ffffff" opacity="0.02">
    <animate attributeName="opacity" values="0.02;0.06;0.02" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- person (simple side silhouette) -->
  <g fill="#d4d4d4">
    <!-- head -->
    <circle cx="170" cy="270" r="18"/>
    <!-- body -->
    <path d="M145 300 Q170 275 195 300 L195 320 L145 320 Z"/>
  </g>

  <!-- arms typing motion -->
  <g stroke="#d4d4d4" stroke-width="5" stroke-linecap="round">
    <line x1="158" y1="292" x2="150" y2="240">
      <animate attributeName="y2" values="240;244;240" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="182" y1="292" x2="190" y2="240">
      <animate attributeName="y2" values="240;244;240" dur="0.6s" repeatCount="indefinite" begin="0.3s"/>
    </line>
  </g>

  <!-- keyboard -->
  <rect x="130" y="238" width="80" height="10" rx="2" fill="#2a2a2a" stroke="#8a8a8a" stroke-width="1"/>

  <!-- ambient side dots -->
  <g fill="#8a8a8a" opacity="0.4">
    <circle cx="40" cy="60" r="1.5"/>
    <circle cx="70" cy="40" r="1.5"/>
    <circle cx="300" cy="50" r="1.5"/>
    <circle cx="270" cy="70" r="1.5"/>
  </g>

  <text x="170" y="30" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8a8a8a" text-anchor="middle" letter-spacing="1">
    still building...
  </text>
</svg>
